<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <meta name="robots" content="noindex" />
    <title>BaconReader patches · e2e recording</title>
    <!-- Plays one e2e recording MP4 with the browser's own video controls: …/e2e-player.html?v=pr-<n>-v<k>-<run>.mp4
         from the prs-resources release. GitHub shows no player for a video it didn't store itself, so the PR comments
         link here (docs/hosting.md, "E2E videos on pull requests"). The video's URL is built from v alone, which must be
         such a name, so the page never plays a URL someone else chose. The link's fragment, #s=<data>, carries the
         scenario's Gherkin and when each line played (the e2e tool's PlayerLinking); the player, e2e-player.js and
         e2e-player.css, shows them beside the video. tools/guide/build.js inlines those two files where the include
         comments are, so the published page is one file: nothing in it can meet a cached copy of another deploy. -->
    <style>
        :root { --bg: #0a0d13; --panel: #111620; --line: #263046; --text: #e7eaf0; --muted: #8a94a8; --arc: #6fe3ff; --warn: #ffcf5a; --fail: #ff6b6b; --now: #1b3346; }
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        header { width: 100%; }
        h1 { margin: 0; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
        .meta { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
        a { color: var(--arc); }
        .note { width: 100%; margin: 0; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--warn); }
        .note code { color: var(--text); overflow-wrap: anywhere; }
        [hidden] { display: none !important; }
        /* The e2e recordings' player (e2e-player.js): the Gherkin beside the video, the line the video is at highlighted, each
   line's time a button, a bar of marks under the video. Everything is under .e2e-player, so it embeds in any page; the
   page sets the colors' variables (--panel, --line, --text, --muted, --arc, --fail, --now). */
.e2e-player { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.e2e-player .player { order: -1; display: flex; flex-direction: column; gap: 8px; max-width: 100%; }
.e2e-player video { display: block; max-width: 100%; max-height: var(--video-height, calc(100vh - 160px)); background: #000;
    border: 1px solid var(--line); border-radius: 8px; }
.e2e-player .bar { position: relative; height: 14px; border-radius: 7px; background: var(--panel); border: 1px solid var(--line);
    cursor: pointer; touch-action: none; }
.e2e-player .bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 7px; background: #2a4a63; pointer-events: none; }
.e2e-player .bar .tick { position: absolute; top: 1px; bottom: 1px; width: 2px; margin-left: -1px; background: #fff; border-radius: 1px;
    pointer-events: none; }
.e2e-player .bar .tick.failed { background: var(--fail); }
.e2e-player .gherkin { width: 100%; margin: 0; padding: 8px 0; list-style: none; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: auto; }
.e2e-player .gherkin li { display: flex; gap: 8px; padding: 1px 12px 1px 8px; border-left: 3px solid transparent; }
.e2e-player .gherkin li.now { background: var(--now); border-left-color: var(--arc); }
.e2e-player .gherkin li.failed { border-left-color: var(--fail); }
.e2e-player .gherkin li.failed .text { color: var(--fail); }
.e2e-player .gherkin .time { flex: none; width: 5ch; padding: 0; border: 0; background: none; color: var(--arc); font: inherit;
    text-align: right; cursor: pointer; }
.e2e-player .gherkin .time:hover, .e2e-player .gherkin .time:focus-visible { text-decoration: underline; outline: none; }
.e2e-player .gherkin .spacer { flex: none; width: 5ch; }
.e2e-player .gherkin .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.e2e-player .gherkin .keyword { color: var(--arc); font-weight: 600; }
.e2e-player .gherkin .comment, .e2e-player .gherkin .tag { color: var(--muted); font-style: italic; }
.e2e-player .gherkin .title { font-weight: 600; }
.e2e-player .gherkin li.unreached .text { opacity: 0.55; }
.e2e-player [hidden] { display: none !important; }
@media (min-width: 900px) {
    .e2e-player.with-gherkin { flex-direction: row; align-items: flex-start; justify-content: center; }
    .e2e-player.with-gherkin .gherkin { flex: 1 1 0; min-width: 320px; max-height: var(--gherkin-height, calc(100vh - 110px)); }
    .e2e-player.with-gherkin .player { order: 0; flex: none; }
}

    </style>
</head>

<body>
    <main>
        <header>
            <h1 id="title">E2E recording</h1>
            <p class="meta" id="meta"></p>
        </header>
        <div id="stage" hidden></div>
        <p class="note" id="note" hidden></p>
    </main>
    <script>
        // The e2e recordings' player, for any page that embeds it (e2e-player.html, the guide index.html; tools/guide/build.js
// inlines this file into each, so a page never meets a cached copy of another deploy):
//   E2EPlayer.mount(element, { src, steps, lazy })
// puts the video of `src` in `element`, with the browser's own controls; with `steps`, { lines, marks } (the scenario's
// Gherkin, a line each, and [{ line, seconds, failed }], in the order they played), the Gherkin beside it: the line the
// video is at highlighted, one at a time, each line's time a button that plays the video from there, a failed line in
// red and the lines never reached dimmed, and a bar under the video marking each line's time (red where it failed), a
// click on it seeking there. With `lazy`, the video loads nothing until it comes near the screen. Returns the video.
//   E2EPlayer.readSteps(data)
// the steps of a player link's fragment data (#s=<data>: the e2e tool's PlayerLinking, deflated JSON in base64url), as
// a promise; it fails for data that isn't such.
(function () {
    "use strict";

    function readSteps(data) {
        if (!/^[A-Za-z0-9_-]+$/.test(data || "") || typeof DecompressionStream === "undefined") {
            return Promise.reject(new Error("no steps"));
        }

        var base64 = data.replace(/-/g, "+").replace(/_/g, "/");
        var bytes = Uint8Array.from(atob(base64 + "===".slice((base64.length + 3) % 4)), function (c) { return c.charCodeAt(0); });
        var inflated = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        return new Response(inflated).text().then(function (text) {
            return toSteps(JSON.parse(text));
        });
    }

    // {"g": Gherkin, "m": [[line, seconds, failed], …]} → { lines, marks }, the marks in the order they played.
    function toSteps(data) {
        if (typeof data.g !== "string" || !Array.isArray(data.m)) {
            throw new Error("not a scenario's steps");
        }

        return {
            lines: data.g.split("\n"),
            marks: data.m
                .filter(function (m) { return Array.isArray(m) && isFinite(m[0]) && isFinite(m[1]); })
                .map(function (m) { return { line: m[0], seconds: m[1], failed: m[2] === 1 }; })
                .sort(function (a, b) { return a.seconds - b.seconds; })
        };
    }

    function make(tag, className, text) {
        var element = document.createElement(tag);
        if (className) {
            element.className = className;
        }

        if (text !== undefined) {
            element.textContent = text;
        }

        return element;
    }

    function mount(root, options) {
        root.classList.add("e2e-player");
        var list = make("ol", "gherkin");
        list.setAttribute("aria-label", "Gherkin");
        list.hidden = true;
        var player = make("div", "player");
        var video = make("video");
        video.controls = true;
        video.playsInline = true;
        video.preload = options.lazy ? "none" : "metadata";
        var bar = make("div", "bar");
        bar.setAttribute("role", "slider");
        bar.setAttribute("aria-label", "Seek");
        bar.tabIndex = -1;
        bar.hidden = true;
        var fill = make("div", "fill");
        bar.append(fill);
        player.append(video, bar);
        root.append(list, player);

        if (options.lazy && "IntersectionObserver" in window) {
            var watching = new IntersectionObserver(function (entries) {
                if (entries.some(function (entry) { return entry.isIntersecting; })) {
                    watching.disconnect();
                    video.preload = "metadata";
                    video.load();
                }
            }, { rootMargin: "400px" });
            watching.observe(root);
        }

        if (options.src) {
            video.src = options.src;
        }

        if (options.steps) {
            showSteps(root, list, video, bar, fill, options.steps);
        }

        return video;
    }

    function showSteps(root, list, video, bar, fill, steps) {
        var items = steps.lines.map(function (text, index) {
            var item = make("li");
            var mark = steps.marks.filter(function (m) { return m.line === index; })[0];
            if (mark) {
                var time = make("button", "time", clock(mark.seconds));
                time.type = "button";
                time.title = "Play from " + clock(mark.seconds);
                time.addEventListener("click", function () { playFrom(video, mark.seconds); });
                item.append(time);
            } else {
                item.append(make("span", "spacer"));
            }

            item.append(describe(text));
            if (steps.marks.length > 0 && !mark && /^\s*(Given|When|Then|And|But) /.test(text)) {
                item.classList.add("unreached");
            }

            if (steps.marks.some(function (m) { return m.line === index && m.failed; })) {
                item.classList.add("failed");
            }

            list.append(item);
            return item;
        });
        list.hidden = false;
        root.classList.add("with-gherkin");
        if (steps.marks.length === 0) {
            return;
        }

        var shown = -1;
        function follow() {
            var at = video.currentTime;
            fill.style.width = (video.duration ? Math.min(100, at / video.duration * 100) : 0) + "%";
            var now = -1;
            steps.marks.forEach(function (m) {
                if (m.seconds <= at + 0.05) {
                    now = m.line;
                }
            });
            if (now === shown) {
                return;
            }

            if (shown >= 0) {
                items[shown].classList.remove("now");
            }

            shown = now;
            if (now >= 0) {
                items[now].classList.add("now");
                keepInView(list, items[now]);
            }
        }

        function ticks() {
            if (!video.duration) {
                return;
            }

            bar.querySelectorAll(".tick").forEach(function (tick) { tick.remove(); });
            steps.marks.forEach(function (m) {
                var tick = make("span", "tick" + (m.failed ? " failed" : ""));
                tick.style.left = Math.min(100, m.seconds / video.duration * 100) + "%";
                bar.append(tick);
            });
            bar.setAttribute("aria-valuemin", "0");
            bar.setAttribute("aria-valuemax", String(Math.round(video.duration)));
            bar.hidden = false;
        }

        function seek(event) {
            var box = bar.getBoundingClientRect();
            if (video.duration && box.width > 0) {
                video.currentTime = Math.max(0, Math.min(1, (event.clientX - box.left) / box.width)) * video.duration;
            }
        }

        bar.addEventListener("pointerdown", function (event) {
            bar.setPointerCapture(event.pointerId);
            seek(event);
        });
        bar.addEventListener("pointermove", function (event) {
            if (bar.hasPointerCapture(event.pointerId)) {
                seek(event);
            }
        });
        video.addEventListener("loadedmetadata", ticks);
        video.addEventListener("durationchange", ticks);
        ["timeupdate", "seeked", "seeking", "play"].forEach(function (name) { video.addEventListener(name, follow); });
        if ("requestVideoFrameCallback" in video) {
            var onFrame = function () {
                follow();
                video.requestVideoFrameCallback(onFrame);
            };
            video.requestVideoFrameCallback(onFrame);
        }

        ticks();
        follow();
    }

    function playFrom(video, seconds) {
        if (video.preload === "none") {
            video.preload = "metadata";
        }

        video.currentTime = seconds;
        var playing = video.play();
        if (playing && playing.catch) {
            playing.catch(function () { });
        }
    }

    // A Gherkin line, its keyword, tags, comment or title set apart.
    function describe(text) {
        var line = make("span", "text");
        var step = /^(\s*)(Given|When|Then|And|But)( .*)$/.exec(text);
        var title = /^(\s*)(Scenario:)(.*)$/.exec(text);
        if (step || title) {
            var parts = step || title;
            line.append(parts[1], make("span", "keyword", parts[2]));
            line.append(title ? make("span", "title", parts[3]) : parts[3]);
        } else {
            line.textContent = text;
            if (/^\s*#/.test(text)) {
                line.classList.add("comment");
            } else if (/^\s*@/.test(text)) {
                line.classList.add("tag");
            }
        }

        return line;
    }

    // Scrolls the list, not the page, so the line shows.
    function keepInView(list, item) {
        if (list.scrollHeight <= list.clientHeight) {
            return;
        }

        var top = item.offsetTop - list.offsetTop;
        if (top < list.scrollTop + 24 || top + item.offsetHeight > list.scrollTop + list.clientHeight - 24) {
            list.scrollTop = top - list.clientHeight / 3;
        }
    }

    function clock(seconds) {
        var whole = Math.floor(seconds);
        return Math.floor(whole / 60) + ":" + String(whole % 60).padStart(2, "0");
    }

    window.E2EPlayer = { mount: mount, readSteps: readSteps, toSteps: toSteps };
})();

    </script>
    <script>
        (function () {
            var repo = "JoanComasFdz/baconreader-reseam-patches";
            var release = "prs-resources";
            var name = /^pr-(\d+)-v(\d+)-([A-Za-z0-9-]+)\.mp4$/;
            var screens = { phone: "📱 Phone", desktop: "🖥️ Desktop" };

            var query = new URLSearchParams(location.search);
            var asset = query.get("v") || "";
            var parts = asset.match(name);
            var stage = document.getElementById("stage");
            var note = document.getElementById("note");

            function say(text, code) {
                note.textContent = text;
                if (code) {
                    var shown = document.createElement("code");
                    shown.textContent = code;
                    note.append(" ", shown);
                }
                note.hidden = false;
            }

            if (!parts) {
                say(asset
                    ? "This page plays only the e2e recordings named pr-<n>-v<k>-<run>.mp4, not:"
                    : "No recording named: open this page from a pull request's e2e comment (…/e2e-player.html?v=pr-<n>-v<k>-<run>.mp4).",
                    asset);
                return;
            }

            var pr = parts[1], version = parts[2], run = parts[3];
            var screen = run.match(/-(phone|desktop)$/);
            var scenario = (screen ? run.slice(0, -screen[0].length) : run).replace(/-/g, " ");
            document.getElementById("title").textContent = scenario.charAt(0).toUpperCase() + scenario.slice(1);
            document.title = "BaconReader patches · " + scenario;

            var meta = document.getElementById("meta");
            var link = document.createElement("a");
            link.href = "https://github.com/" + repo + "/pull/" + pr;
            link.textContent = "PR #" + pr;
            meta.append(link, " · V" + version + (screen ? " · " + screens[screen[1]] : "") + " · " + release);

            var src = "https://github.com/" + repo + "/releases/download/" + release + "/" + asset;
            var hash = /^#s=(.+)$/.exec(location.hash);
            (hash ? E2EPlayer.readSteps(hash[1]) : Promise.reject()).then(function (steps) { return steps; }, function () { return null; })
                .then(function (steps) {
                    var video = E2EPlayer.mount(stage, { src: src, steps: steps });
                    stage.hidden = false;
                    video.addEventListener("error", function () {
                        stage.hidden = true;
                        say("This recording can't be loaded. Closing a pull request keeps only each scenario's newest recording, so this one, "
                            + "recorded again later, is gone:", asset);
                    });
                });
        })();
    </script>
</body>

</html>
