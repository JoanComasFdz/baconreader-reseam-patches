name: release

on:
  push:
    tags:
      - 'v*'
  # "Run workflow" on main, with a new version: tags main with it, then releases it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The new version, such as v0.1.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      RESEAM_BIN: ${{ github.workspace }}/engine/reseam
      RESEAM_BUNDLE_KEY: ${{ github.workspace }}/bundle-signing.key
      RELEASE_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Full history, so the release notes can list the commits since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag pushed with the workflow's token starts no other run, so this run releases it.
      - name: Tag main
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run the release from main." >&2
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version must look like v0.1.2, not $TAG." >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the Reseam CLI and signing key
        run: |
          mkdir -p engine
          version=$(sed -n 's/.*id("app.reseam.workspace") version "\(.*\)".*/\1/p' settings.gradle.kts)
          curl -fsSL -o engine/reseam https://cdn.reseam.app/engine/v$version/reseam-linux-x64
          chmod +x engine/reseam
          echo "${{ secrets.BUNDLE_SIGNING_KEY_B64 }}" | base64 -d > bundle-signing.key

      - name: Build the bundle
        run: ./gradlew bundle -PreleaseTag=$TAG --no-daemon

      - name: Publish the release
        run: engine/reseam release patches build/reseam/*.reseam --tag $TAG
